<!DOCTYPE html>
<html>
<head>
<title>Hex Color Table</title>
<style>
table { border-collapse: collapse; }
td {
  border: 1px solid #333;
  padding: 10px;
  width: 100px;
  text-align: center;
}
</style>
</head>
<body>

<h2>Hex Color Table</h2>
<table>
<tr>
  <td onmouseover="this.style.background='#FF0000'"
      onmouseout="this.style.background='white'">#FF0000</td>
  <td onmouseover="this.style.background='#00FF00'"
      onmouseout="this.style.background='white'">#00FF00</td>
  <td onmouseover="this.style.background='#0000FF'"
      onmouseout="this.style.background='white'">#0000FF</td>
</tr>
</table>

</body>
</html>
