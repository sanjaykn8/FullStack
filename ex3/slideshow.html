<!DOCTYPE html>
<html>
<head>
<title>Slideshow</title>
</head>
<body>

<h2>Slideshow</h2>
<img id="slide" src="1.jpg" width="300"><br><br>
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>

<script>
let i = 1;
function next() {
  i = (i % 3) + 1;
  document.getElementById("slide").src = i + ".jpg";
}
function prev() {
  i = (i + 1) % 3 + 1;
  document.getElementById("slide").src = i + ".jpg";
}
</script>

</body>
</html>
