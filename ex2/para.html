<html>
<head>
  <style>
    .rounded-box{
      width: 300px;
      height: 100px;
      padding: 15px;
      background-color: #eaeaea;
      border-radius: 15px;
    }

    .bg-image{
      width: 300px;
      height: 150px;
      margin-top: 20px;
      border-radius: 20px;
      overflow: hidden;  
    }

    .bg-image img{
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <p class="rounded-box">
    This paragraph has rounded corners.
  </p>

  <div class="bg-image">
    <img src="pics/bg.png" alt="background image">
  </div>

</body>
</html>
