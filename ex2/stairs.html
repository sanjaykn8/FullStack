<html>
<head>
  <style>
    body{font-family:system-ui, Arial; padding:20px; background:#f4f6f9;}
    .stair{ position:relative; height:260px; width:760px; }
    .step{
      position:absolute;
      width:260px; height:56px;
      background:#fff; border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      display:flex; align-items:center; padding:0 14px;
      font-weight:600;
    }
    .step:nth-child(1){ left:0;   top:0;   background:#fffbf0; }
    .step:nth-child(2){ left:120px; top:60px;  background:#f0fbff; }
    .step:nth-child(3){ left:240px; top:120px; background:#f7fff4; }
    .step:nth-child(4){ left:360px; top:180px; background:#fff6ff; }
  </style>
</head>
<body>
  <div class="stair">
    <div class="step">Step 1</div>
    <div class="step">Step 2</div>
    <div class="step">Step 3</div>
    <div class="step">Step 4</div>
  </div>
</body>
</html>
