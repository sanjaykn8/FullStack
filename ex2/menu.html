<html>
<head>
<style>
    body{
      font-family:fantasy;
      padding: 20px;
    }

    .vmenu ul{
      list-style: none;
      padding: 0;
      margin: 0;
      width: 160px;
      border: 1px solid #ccc;
    }

    .vmenu li{
      border-bottom: 1px solid #ccc;
    }

    .vmenu li:last-child{
      border-bottom: none;
    }

    .vmenu a{
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #000;
    }

    .hmenu ul{
      list-style: none;
      padding: 0;
      margin: 20px 0 0 0;
    }

    .hmenu li{
      display: inline;
      margin-right: 15px;
    }

    .hmenu a{
      text-decoration: none;
      color: #000;
      padding: 8px 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <h3>Vertical Menu</h3>
  <nav class="vmenu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Events</a></li>
      <li><a href="#">Schedule</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <h3>Horizontal Menu</h3>
  <nav class="hmenu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Events</a></li>
      <li><a href="#">Schedule</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
